name: Dashboard regression checks
on:
  push:
    branches: [main]
    paths: ['**.js', '**.py', '**.html', '**.css', 'tests/**', '.github/workflows/dashboard-tests.yml']
  pull_request:
    paths: ['**.js', '**.py', '**.html', '**.css', 'tests/**', '.github/workflows/dashboard-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript behavior and failure handling
        run: node --test tests/*.test.js
      - name: Feed parsing, identity and settlement
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Audit current feeds without changing snapshots
        run: node scripts/audit_dashboard.js > dashboard-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-audit
          path: dashboard-audit.json
