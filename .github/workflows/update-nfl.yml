name: Refresh NFL independently
on:
  workflow_dispatch:
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-nfl.yml'
      - 'scripts/update_kalshi.py'
      - 'scripts/publish_nfl_snapshot.py'
      - 'scripts/preserve_newer_nfl.py'
      - 'nfl-live-recovery.js'
permissions:
  contents: write
concurrency:
  group: nfl-price-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch schedule-verified NFL quotes
        timeout-minutes: 3
        run: python scripts/update_kalshi.py
      - name: Verify NFL player rosters
        timeout-minutes: 3
        run: python scripts/verify_snapshot_rosters.py
      - name: Refresh NFL matchup context
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/enrich_snapshot_context.py
      - name: Publish NFL without waiting for other sports
        run: python scripts/publish_nfl_snapshot.py
