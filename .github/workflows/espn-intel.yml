name: Automatic ESPN matchup lookup
# Manual refresh requested 2026-11-22; scheduled collection remains unchanged.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_espn_intel.py'
      - 'scripts/publish_espn_intel.py'
      - 'scripts/update_analyst_consensus.py'
      - 'scripts/update_source_intel.py'
      - 'espn-intel.js'
      - '.github/workflows/espn-intel.yml'
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: espn-matchup-intel
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install analyst page parser
        run: python -m pip install "lxml>=5,<7"
      - name: Ensure official report text extraction is available
        run: |
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Verify ESPN identity and freshness guards
        run: |
          python -m unittest discover -s tests -p 'test_espn_intel.py'
          node --test tests/espn-intel.test.js tests/matchup-prop-intel.test.js
          python -m unittest discover -s tests -p 'test_analyst_consensus.py'
          python -m unittest discover -s tests -p 'test_source_intel.py'
      - name: Look up current games, previews and expert picks
        run: python scripts/update_espn_intel.py
      - name: Collect published non-NFL analyst opinions
        run: python scripts/update_analyst_consensus.py
      - name: Collect additional verified sport-specific facts
        run: python scripts/update_source_intel.py
      - name: Publish independently of market prices
        run: python scripts/publish_espn_intel.py
