name: Update Kalshi NFL snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_kalshi.py'
      - '.github/workflows/update-kalshi.yml'
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
    - cron: '8,18,28,38,48,58 * * * *'

permissions:
  contents: write

concurrency:
  group: kalshi-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and normalize Kalshi NFL markets
        run: python scripts/update_kalshi.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kalshi-nfl.json
          if git diff --cached --quiet; then
            echo "No market changes"
            exit 0
          fi
          git commit -m "Update Kalshi NFL market snapshot"
          git pull --rebase origin main
          git push
