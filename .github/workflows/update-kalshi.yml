name: Update Kalshi sports snapshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_kalshi.py'
      - 'kalshi-provider.js'
      - 'scripts/update_kalshi_ufc.py'
      - 'scripts/update_kalshi_ncaaf.py'
      - 'scripts/update_kalshi_mlb.py'
      - 'scripts/update_kalshi_nhl.py'
      - 'scripts/update_nhl_context.py'
      - 'nhl-model.js'
      - 'nhl-alt-lines.js'
      - 'team-alt-lines.js'
      - 'mlb-dashboard.js'
      - 'ncaaf-dashboard.js'
      - 'nhl-dashboard.js'
      - 'scripts/update_mlb_context.py'
      - 'scripts/attach_game_context.py'
      - 'scripts/update_ncaaf_context.py'
      - 'scripts/update_sports_media.py'
      - 'scripts/verify_snapshot_rosters.py'
      - 'scripts/enrich_snapshot_context.py'
      - 'scripts/update_nfl_td_context.py'
      - 'nfl-td-model.js'
      - 'scripts/update_pick_history.js'
      - 'scripts/snapshot_daily_picks.js'
      - 'scripts/check_dashboard_health.js'
      - 'tests/dashboard-automation.test.js'
      - 'scripts/settle_pick_history.py'
      - 'scripts/build_model_calibration.js'
      - 'scripts/update_forecast_audit.js'
      - 'scripts/settle_forecast_audit.py'
      - 'scripts/build_forecast_report.js'
      - '.github/workflows/update-kalshi.yml'
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
    - cron: '8,18,28,38,48,58 * * * *'

permissions:
  contents: write

concurrency:
  group: kalshi-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and normalize Kalshi NFL markets
        run: python scripts/update_kalshi.py
      - name: Fetch and normalize Kalshi NCAAF markets
        run: python scripts/update_kalshi_ncaaf.py
      - name: Fetch and normalize Kalshi UFC markets
        run: python scripts/update_kalshi_ufc.py
      - name: Fetch and normalize Kalshi MLB markets
        run: python scripts/update_kalshi_mlb.py
      - name: Check NHL models and player-market mapping
        run: |
          node --test tests/team-alt-lines.test.js tests/pick-of-day.test.js tests/ncaaf-dashboard-display.test.js tests/mlb-distinct-parlay.test.js
          node --test tests/nhl-model.test.js tests/nhl-alt-lines.test.js tests/nhl-dashboard.test.js
          python -m unittest discover -s tests -p 'test_nhl*.py'
      - name: Refresh official NHL model context
        run: python scripts/update_nhl_context.py
      - name: Fetch and schedule-verify Kalshi NHL markets
        run: python scripts/update_kalshi_nhl.py
      - name: Fetch free MLB probable-pitcher context
        run: python scripts/update_mlb_context.py
      - name: Match MLB games to schedule
        run: python scripts/attach_game_context.py
      - name: Match college games to schedule
        run: python scripts/attach_game_context.py --ncaaf
      - name: Refresh free NCAAF pregame context
        run: python scripts/update_ncaaf_context.py
      - name: Verify player props against ESPN rosters
        run: python scripts/verify_snapshot_rosters.py
      - name: Enrich games with ESPN matchup context
        run: python scripts/enrich_snapshot_context.py
      - name: Add completed-play touchdown opportunity
        run: python scripts/update_nfl_td_context.py
      - name: Match team and fighter media
        run: python scripts/update_sports_media.py
      - name: Track and settle pregame model picks
        run: |
          python scripts/settle_pick_history.py
          node scripts/build_model_calibration.js
          node scripts/update_pick_history.js
      - name: Audit all eligible pregame forecasts
        run: |
          python scripts/settle_forecast_audit.py
          node scripts/update_forecast_audit.js
          node scripts/build_forecast_report.js
      - name: Check recommendation archive and health rules
        run: node --test tests/dashboard-automation.test.js
      - name: Save daily dashboard recommendations
        timeout-minutes: 5
        env:
          TZ: America/Los_Angeles
        run: node scripts/snapshot_daily_picks.js
      - name: Check dashboard health
        if: always()
        env:
          REFRESH_STATUS: ${{ job.status }}
        run: node scripts/check_dashboard_health.js
      - name: Preserve health diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-health-${{ github.run_id }}
          path: data/dashboard-health.json
          retention-days: 30
      - name: Validate generated snapshots
        run: |
          python - <<'PY'
          import json, pathlib, sys
          files = [
            'data/kalshi-nfl.json','data/kalshi-ncaaf.json','data/kalshi-ufc.json',
            'data/kalshi-mlb.json','data/kalshi-nhl.json','data/nhl-context.json','data/mlb-context.json','data/ncaaf-context.json','data/sports-media.json',
            'data/pick-history.json','data/model-calibration.js',
            'data/forecast-audit.json','data/forecast-report.json','data/daily-picks.json','data/dashboard-health.json'
          ]
          for name in files:
              p=pathlib.Path(name)
              if not p.exists() or p.stat().st_size < 2:
                  raise SystemExit(f'INVALID SNAPSHOT: {name} is missing/empty')
              raw=p.read_text()
              if name == 'data/model-calibration.js':
                  if not raw.startswith('window.MODEL_CALIBRATION_DATA=') or not raw.rstrip().endswith(';'):
                      raise SystemExit('INVALID CALIBRATION: bad script wrapper')
                  raw=raw[len('window.MODEL_CALIBRATION_DATA='):].rstrip()[:-1]
              try: data=json.loads(raw)
              except Exception as e: raise SystemExit(f'INVALID SNAPSHOT: {name}: {e}')
              if name == 'data/kalshi-nfl.json':
                  if not isinstance(data.get('games'), list) or any(
                      not isinstance(game.get('markets'), list) for game in data['games']
                  ):
                      raise SystemExit(f'INVALID SNAPSHOT: {name} has invalid games/markets')
              elif name.startswith('data/kalshi-') and not isinstance(data.get('markets'), list):
                  raise SystemExit(f'INVALID SNAPSHOT: {name} has no markets array')
              elif name == 'data/pick-history.json' and not isinstance(data.get('records'), list):
                  raise SystemExit(f'INVALID HISTORY: {name} has no records array')
              elif name == 'data/nhl-context.json' and not isinstance(data.get('games'), dict):
                  raise SystemExit(f'INVALID NHL CONTEXT: {name} has no games object')
              elif name == 'data/ncaaf-context.json' and not isinstance(data.get('games'), dict):
                  raise SystemExit(f'INVALID NCAAF CONTEXT: {name} has no games object')
              elif name == 'data/forecast-audit.json' and not isinstance(data.get('records'), list):
                  raise SystemExit(f'INVALID AUDIT: {name} has no records array')
              elif name == 'data/daily-picks.json' and not isinstance(data.get('records'), list):
                  raise SystemExit('INVALID DAILY PICKS: records array missing')
              elif name == 'data/dashboard-health.json' and not isinstance(data.get('alerts'), list):
                  raise SystemExit('INVALID HEALTH REPORT: alerts array missing')
              elif name == 'data/forecast-report.json' and not isinstance(data.get('sports'), dict):
                  raise SystemExit(f'INVALID REPORT: {name} has no sports object')
              elif name == 'data/model-calibration.js' and not isinstance(data.get('sports'), dict):
                  raise SystemExit(f'INVALID CALIBRATION: {name} has no sports object')
          print('All generated snapshots are valid JSON')
          PY
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the freshly generated snapshot outside the worktree while we
          # synchronize with main. This avoids rebasing two generated versions
          # of the same JSON file when another scheduled run pushed first.
          cp data/kalshi-nfl.json /tmp/kalshi-nfl.json
          cp data/kalshi-ufc.json /tmp/kalshi-ufc.json
          cp data/kalshi-ncaaf.json /tmp/kalshi-ncaaf.json
          cp data/kalshi-mlb.json /tmp/kalshi-mlb.json
          cp data/kalshi-nhl.json /tmp/kalshi-nhl.json
          cp data/nhl-context.json /tmp/nhl-context.json
          cp data/mlb-context.json /tmp/mlb-context.json
          cp data/ncaaf-context.json /tmp/ncaaf-context.json
          cp data/sports-media.json /tmp/sports-media.json
          cp data/pick-history.json /tmp/pick-history.json
          cp data/model-calibration.js /tmp/model-calibration.js
          cp data/forecast-audit.json /tmp/forecast-audit.json
          cp data/forecast-report.json /tmp/forecast-report.json
          cp data/daily-picks.json /tmp/daily-picks.json
          cp data/dashboard-health.json /tmp/dashboard-health.json
          mkdir -p /tmp/daily-pick-archive
          cp data/daily-picks/*.json /tmp/daily-pick-archive/
          git restore data/kalshi-nfl.json
          git restore data/kalshi-ufc.json 2>/dev/null || true
          git restore data/kalshi-ncaaf.json 2>/dev/null || true
          git restore data/kalshi-mlb.json 2>/dev/null || true
          git restore data/kalshi-nhl.json 2>/dev/null || true
          git restore data/nhl-context.json 2>/dev/null || true
          git restore data/mlb-context.json 2>/dev/null || true
          git restore data/ncaaf-context.json 2>/dev/null || true
          git restore data/sports-media.json 2>/dev/null || true
          git restore data/pick-history.json 2>/dev/null || true
          git restore data/model-calibration.js 2>/dev/null || true
          git restore data/forecast-audit.json 2>/dev/null || true
          git restore data/forecast-report.json 2>/dev/null || true
          git restore data/daily-picks.json 2>/dev/null || true
          git restore data/dashboard-health.json 2>/dev/null || true
          git restore data/daily-picks 2>/dev/null || true
          git pull --rebase origin main
          python scripts/preserve_newer_nfl.py /tmp/kalshi-nfl.json data/kalshi-nfl.json
          cp /tmp/kalshi-ufc.json data/kalshi-ufc.json
          cp /tmp/kalshi-ncaaf.json data/kalshi-ncaaf.json
          cp /tmp/kalshi-mlb.json data/kalshi-mlb.json
          cp /tmp/kalshi-nhl.json data/kalshi-nhl.json
          cp /tmp/nhl-context.json data/nhl-context.json
          cp /tmp/mlb-context.json data/mlb-context.json
          cp /tmp/ncaaf-context.json data/ncaaf-context.json
          cp /tmp/sports-media.json data/sports-media.json
          cp /tmp/pick-history.json data/pick-history.json
          cp /tmp/model-calibration.js data/model-calibration.js
          cp /tmp/forecast-audit.json data/forecast-audit.json
          cp /tmp/forecast-report.json data/forecast-report.json
          cp /tmp/daily-picks.json data/daily-picks.json
          cp /tmp/dashboard-health.json data/dashboard-health.json
          mkdir -p data/daily-picks
          cp /tmp/daily-pick-archive/*.json data/daily-picks/

          git add data/kalshi-nfl.json data/kalshi-ufc.json data/kalshi-ncaaf.json data/kalshi-mlb.json data/kalshi-nhl.json data/nhl-context.json data/mlb-context.json data/ncaaf-context.json data/sports-media.json data/pick-history.json data/model-calibration.js data/forecast-audit.json data/forecast-report.json data/daily-picks.json data/dashboard-health.json data/daily-picks/
          if git diff --cached --quiet; then
            echo "No market changes"
            exit 0
          fi

          git commit -m "Update Kalshi sports market snapshots"

          # A different run can still land between pull and push. Retry once by
          # rebuilding the commit on the newest main without merging JSON.
          if ! git push; then
            echo "Main advanced during push; retrying snapshot commit"
            cp data/kalshi-nfl.json /tmp/kalshi-nfl.json
            cp data/kalshi-ufc.json /tmp/kalshi-ufc.json
            cp data/kalshi-ncaaf.json /tmp/kalshi-ncaaf.json
            cp data/kalshi-mlb.json /tmp/kalshi-mlb.json
            cp data/kalshi-nhl.json /tmp/kalshi-nhl.json
            cp data/nhl-context.json /tmp/nhl-context.json
            cp data/mlb-context.json /tmp/mlb-context.json
            cp data/ncaaf-context.json /tmp/ncaaf-context.json
            cp data/sports-media.json /tmp/sports-media.json
            cp data/pick-history.json /tmp/pick-history.json
            cp data/model-calibration.js /tmp/model-calibration.js
            cp data/forecast-audit.json /tmp/forecast-audit.json
            cp data/forecast-report.json /tmp/forecast-report.json
            cp data/daily-picks.json /tmp/daily-picks.json
            cp data/dashboard-health.json /tmp/dashboard-health.json
            mkdir -p /tmp/daily-pick-archive
            cp data/daily-picks/*.json /tmp/daily-pick-archive/
            git reset --hard HEAD~1
            git pull --rebase origin main
            python scripts/preserve_newer_nfl.py /tmp/kalshi-nfl.json data/kalshi-nfl.json
            cp /tmp/kalshi-ufc.json data/kalshi-ufc.json
            cp /tmp/kalshi-ncaaf.json data/kalshi-ncaaf.json
            cp /tmp/kalshi-mlb.json data/kalshi-mlb.json
            cp /tmp/kalshi-nhl.json data/kalshi-nhl.json
            cp /tmp/nhl-context.json data/nhl-context.json
            cp /tmp/mlb-context.json data/mlb-context.json
            cp /tmp/ncaaf-context.json data/ncaaf-context.json
            cp /tmp/sports-media.json data/sports-media.json
            cp /tmp/pick-history.json data/pick-history.json
            cp /tmp/model-calibration.js data/model-calibration.js
            cp /tmp/forecast-audit.json data/forecast-audit.json
            cp /tmp/forecast-report.json data/forecast-report.json
            cp /tmp/daily-picks.json data/daily-picks.json
            cp /tmp/dashboard-health.json data/dashboard-health.json
            mkdir -p data/daily-picks
            cp /tmp/daily-pick-archive/*.json data/daily-picks/
            git add data/kalshi-nfl.json data/kalshi-ufc.json data/kalshi-ncaaf.json data/kalshi-mlb.json data/kalshi-nhl.json data/nhl-context.json data/mlb-context.json data/ncaaf-context.json data/sports-media.json data/pick-history.json data/model-calibration.js data/forecast-audit.json data/forecast-report.json data/daily-picks.json data/dashboard-health.json data/daily-picks/
            if git diff --cached --quiet; then
              echo "Newer snapshot already landed"
              exit 0
            fi
            git commit -m "Update Kalshi sports market snapshots"
            git push
          fi
