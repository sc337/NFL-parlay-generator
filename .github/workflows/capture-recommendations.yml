name: Capture dashboard recommendations

on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: write

concurrency:
  group: daily-recommendation-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture from the latest published prices
        env:
          TZ: America/Los_Angeles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/snapshot_daily_picks.js
            node scripts/check_dashboard_health.js
            git add data/daily-picks.json data/daily-picks/ data/dashboard-health.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Capture recommendations from current sports prices'
            if git push origin HEAD:main; then exit 0; fi
            echo "Main advanced during capture; retrying with current prices ($attempt/3)"
          done
          exit 1
