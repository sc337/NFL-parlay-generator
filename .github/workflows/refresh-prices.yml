name: Keep sports prices fresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-prices.yml'
      - 'scripts/refresh_price_worker.py'
      - 'scripts/refresh_forecast_worker.py'
      - 'scripts/update_forecast_audit.js'
      - 'scripts/update_kalshi.py'
      - 'scripts/verify_snapshot_rosters.py'
      - 'scripts/update_kalshi_ufc.py'
      - 'scripts/preserve_newer_snapshot.py'
      - 'scripts/update_public_starters.py'
      - 'scripts/update_ncaaf_slate.py'
      - 'scripts/update_kalshi_ncaaf.py'
      - 'scripts/update_public_odds.py'
      - 'scripts/update_polymarket.py'
      - 'scripts/update_espn_evidence.py'
      - 'espn-evidence.js'
      - 'scripts/update_ncaaf_context.py'
      - 'starter-status.js'
      - 'scripts/update_kalshi_nba.py'
      - 'nba-model.js'
      - 'nba-dashboard.js'
      - 'nba-alt-lines.js'
      - 'sport-markets.js'
  schedule:
    - cron: '19 * * * *'

permissions:
  contents: write

jobs:
  prices:
    concurrency:
      group: rolling-sports-price-worker
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check refresh safeguards
        run: python -m unittest discover -s tests -p 'test_price_worker.py'
      - name: Refresh independently every ten minutes between schedule dispatches
        env:
          TZ: America/Los_Angeles
          REFRESH_STATUS: success
        run: python -u scripts/refresh_price_worker.py --minutes 330 --interval 600 --sports mlb ncaaf ufc

  nfl-prices:
    concurrency:
      group: rolling-nfl-price-worker
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check NFL refresh safeguards
        run: python -m unittest discover -s tests -p 'test_price_worker.py'
      - name: Publish NFL independently of other sports and recommendation capture
        env:
          TZ: America/Los_Angeles
        run: python -u scripts/refresh_price_worker.py --minutes 330 --interval 600 --sports nfl

  nba-prices:
    concurrency:
      group: rolling-nba-price-worker
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check NBA mapping and model safeguards
        run: |
          python -m unittest discover -s tests -p 'test_nba*.py'
          node --test tests/nba*.test.js
      - name: Publish NBA independently of slower sports
        env:
          TZ: America/Los_Angeles
        run: python -u scripts/refresh_price_worker.py --minutes 330 --interval 600 --sports nba

  nhl-prices:
    concurrency:
      group: rolling-nhl-price-worker
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check NHL refresh safeguards
        run: python -m unittest discover -s tests -p 'test_nhl_refresh.py'
      - name: Publish NHL prices independently every ten minutes
        env:
          TZ: America/Los_Angeles
        run: python -u scripts/refresh_price_worker.py --minutes 330 --interval 600 --sports nhl

  starter-checks:
    concurrency:
      group: rolling-public-starter-checks
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public-page identity and confirmation parsing
        run: python -m unittest discover -s tests -p 'test_public_starters.py'
      - name: Read public starter pages every five minutes
        run: python -u scripts/update_public_starters.py --minutes 330 --interval 300 --publish
