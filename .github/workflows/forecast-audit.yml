name: Record and settle forward forecasts
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/forecast-audit.yml', 'scripts/refresh_forecast_worker.py', 'scripts/update_forecast_audit.js', 'scripts/build_forecast_report.js', 'scripts/nfl_total_study.js', 'scripts/settle_forecast_audit.py', 'nfl-projection-engine.js', 'scripts/update_pick_history.js', 'scripts/settle_pick_history.py', 'scripts/settle_espn_reference.py', 'study-policy.js']
permissions:
  contents: write
concurrency:
  group: forward-forecast-evidence
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check immutable archive and settlement rules
        run: |
          python -m unittest discover -s tests -p 'test_forecast*.py'
          node --test tests/forecast-audit.test.js tests/nfl-total-study.test.js tests/nfl-totals.test.js
      - name: Capture fresh pregame forecasts and settle verified results
        env:
          TZ: America/Los_Angeles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -u scripts/refresh_forecast_worker.py
